name: Website Validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:accounts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npx --yes firebase-tools@15.29.0 emulators:exec --only auth,firestore --project demo-fishadise-accounts --config test/firebase.json 'ACCOUNT_EMULATOR_TEST=1 node --test test/player-accounts.test.mjs'
