    <main id="main" class="faq-page-list">
      <div class="support-form-wrap">
        <header class="support-form-heading">
          <h1 id="deletion-title">Account Deletion</h1>
        </header>
        <form id="deletion-form" class="support-form" action="/api/deletion-requests" method="post" aria-labelledby="deletion-title">
          <div class="form-grid">
            <div class="form-field">
              <label for="deletion-name">Name</label>
              <input id="deletion-name" name="name" type="text" autocomplete="name" minlength="2" maxlength="80" required />
            </div>
            <div class="form-field">
              <label for="deletion-email">Email</label>
              <input id="deletion-email" name="email" type="email" autocomplete="email" maxlength="254" required />
            </div>
            <div class="form-field">
              <label for="deletion-game">Game</label>
              <select id="deletion-game" name="game" required>
                <option value="">Choose a game</option>
                <option>Doggy Match Mania</option>
                <option>Kitty Match Mania</option>
                <option value="other">Other game</option>
              </select>
            </div>
            <div class="form-field" id="deletion-other-game-field" hidden>
              <label for="deletion-other-game">Game name</label>
              <input id="deletion-other-game" name="otherGame" type="text" minlength="2" maxlength="100" disabled />
            </div>
          </div>
          <div class="form-field">
            <label for="deletion-details">Account details <span>(optional)</span></label>
            <textarea id="deletion-details" name="details" rows="3" maxlength="1000" aria-describedby="deletion-note"></textarea>
            <small id="deletion-note">Do not include passwords or sign-in codes.</small>
          </div>
          <div class="honeypot" aria-hidden="true">
            <label for="deletion-website">Website</label>
            <input id="deletion-website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>
          <div class="support-submit-row">
            <button class="button button-primary" type="submit" disabled>Send request</button>
          </div>
          <p id="deletion-status" class="form-status" role="status"></p>
          <noscript><p>Enable JavaScript to send your deletion request.</p></noscript>
        </form>
      </div>
    </main>

    <footer class="site-footer">
